    <script>
      // Injected by app/launch/route.ts from app/_lib/launch.ts — the single
      // source of truth for the launch time, shared with /, /play and /game.html.
      const LAUNCH_AT = __LAUNCH_AT_MS__;

      // TODO: point this at wherever the MOVE game (movethemovementclan-frontend's
      // /play route) actually ends up deployed. Assumes the root domain gets cut
      // over to the real site at/after launch — update if that's not the plan.
      function unlockPlayButton() {
        const btn = document.getElementById("playGame");
        if (!btn || !btn.classList.contains("is-locked")) return;

        btn.classList.remove("is-locked");
        btn.href = btn.dataset.href;
        btn.removeAttribute("aria-disabled");
        btn.removeAttribute("tabindex");

        const label = document.getElementById("playGameLabel");
        if (label) label.textContent = "Ready to Move";

        const note = document.getElementById("unlockNote");
        if (note) {
          note.textContent = "Live now — tap play";
          note.classList.add("is-live");
        }
      }

      function initLaunchCountdown() {
        const root = document.getElementById("launchCountdown");
        if (!root) return;

        const hoursEl = document.getElementById("cdHours");
        const minutesEl = document.getElementById("cdMinutes");
        const secondsEl = document.getElementById("cdSeconds");
        const labelEl = root.querySelector(".countdown__label");
        const pad = (value) => String(value).padStart(2, "0");

        let previous = null;
        let timer = null;

        function playTick(el, value) {
          if (previous && previous[el.id] === value) return;
          el.classList.remove("is-ticking");
          // Force reflow so the animation restarts even if the class never left.
          void el.offsetWidth;
          el.classList.add("is-ticking");
        }

        function render() {
          const remaining = LAUNCH_AT - Date.now();

          if (remaining <= 0) {
            labelEl.textContent = "We're live";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";
            root.classList.add("countdown--live");
            unlockPlayButton();
            if (timer) clearInterval(timer);
            return;
          }

          const totalSeconds = Math.floor(remaining / 1000);
          const next = {
            cdHours: pad(Math.floor(totalSeconds / 3600)),
            cdMinutes: pad(Math.floor((totalSeconds % 3600) / 60)),
            cdSeconds: pad(totalSeconds % 60),
          };

          hoursEl.textContent = next.cdHours;
          minutesEl.textContent = next.cdMinutes;
          secondsEl.textContent = next.cdSeconds;

          playTick(secondsEl, next.cdSeconds);
          playTick(minutesEl, next.cdMinutes);
          playTick(hoursEl, next.cdHours);

          previous = next;
        }

        render();
        timer = setInterval(render, 1000);
      }

      initLaunchCountdown();

      const waitlistLink = document.getElementById("waitlist");
      const modal = document.getElementById("waitlistModal");
      const frame = modal.querySelector(".waitlist-modal__frame");
      let lastFocused = null;

      function openWaitlistModal(event) {
        event.preventDefault();
        lastFocused = document.activeElement;
        if (!frame.dataset.loaded) {
          frame.addEventListener(
            "load",
            () => {
              frame.dataset.loaded = "true";
              frame.classList.add("is-loaded");
              modal
                .querySelector(".waitlist-modal__loader")
                .classList.add("is-hidden");
            },
            { once: true },
          );
          frame.src = frame.dataset.src;
        }
        modal.setAttribute("data-open", "true");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        modal.querySelector(".waitlist-modal__close").focus();
      }

      function closeWaitlistModal() {
        modal.setAttribute("data-open", "false");
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        if (lastFocused) lastFocused.focus();
      }

      if (waitlistLink)
        waitlistLink.addEventListener("click", openWaitlistModal);

      for (const el of modal.querySelectorAll("[data-close]")) {
        el.addEventListener("click", closeWaitlistModal);
      }

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          modal.getAttribute("data-open") === "true"
        ) {
          closeWaitlistModal();
        }
      });

      const reviewVideos = ["/reviews/client-reviews-01.mp4"];

      const reviewsTrigger = document.getElementById("reviewsTrigger");
      const reviewsModal = document.getElementById("reviewsModal");
      const reviewsVideo = reviewsModal.querySelector(".reviews-modal__video");
      const reviewsPlayBtn = reviewsModal.querySelector("[data-play]");
      const reviewsPrevBtn = reviewsModal.querySelector("[data-prev]");
      const reviewsNextBtn = reviewsModal.querySelector("[data-next]");
      const reviewsCounter = reviewsModal.querySelector("[data-counter]");
      let reviewsIndex = 0;
      let reviewsLastFocused = null;

      function loadReview(index) {
        reviewsVideo.pause();
        reviewsIndex = index;
        reviewsVideo.src = reviewVideos[reviewsIndex];
        reviewsVideo.load();
        reviewsPlayBtn.classList.remove("is-hidden");
        reviewsCounter.textContent = `${reviewsIndex + 1} / ${reviewVideos.length}`;
        reviewsPrevBtn.disabled = reviewsIndex === 0;
        reviewsNextBtn.disabled = reviewsIndex === reviewVideos.length - 1;
      }

      function openReviewsModal() {
        reviewsLastFocused = document.activeElement;
        loadReview(0);
        reviewsModal.setAttribute("data-open", "true");
        reviewsModal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        reviewsModal.querySelector(".reviews-modal__close").focus();
      }

      function closeReviewsModal() {
        reviewsVideo.pause();
        reviewsModal.setAttribute("data-open", "false");
        reviewsModal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        if (reviewsLastFocused) reviewsLastFocused.focus();
      }

      if (reviewsTrigger)
        reviewsTrigger.addEventListener("click", openReviewsModal);

      for (const el of reviewsModal.querySelectorAll("[data-close]")) {
        el.addEventListener("click", closeReviewsModal);
      }

      reviewsPlayBtn.addEventListener("click", () => {
        reviewsVideo.play();
      });
      reviewsVideo.addEventListener("play", () => {
        reviewsPlayBtn.classList.add("is-hidden");
      });
      reviewsVideo.addEventListener("pause", () => {
        reviewsPlayBtn.classList.remove("is-hidden");
      });
      reviewsVideo.addEventListener("ended", () => {
        reviewsPlayBtn.classList.remove("is-hidden");
      });

      reviewsPrevBtn.addEventListener("click", () => {
        if (reviewsIndex > 0) loadReview(reviewsIndex - 1);
      });
      reviewsNextBtn.addEventListener("click", () => {
        if (reviewsIndex < reviewVideos.length - 1)
          loadReview(reviewsIndex + 1);
      });

      if (reviewVideos.length <= 1) {
        reviewsPrevBtn.style.display = "none";
        reviewsNextBtn.style.display = "none";
      }

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          reviewsModal.getAttribute("data-open") === "true"
        ) {
          closeReviewsModal();
        }
      });
    </script>
  </body>
</html>
